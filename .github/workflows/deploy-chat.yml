# Deploys the chat assistant (worker/) to Cloudflare when the Worker changes, or on demand.
# The assistant reads the website content live from /chat-knowledge.txt, so content changes
# don't need a redeploy.
#
# Needs three repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   - Cloudflare API token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  - your Cloudflare account ID
#   ANTHROPIC_API_KEY      - Claude API key from console.anthropic.com
# Until they're all added, the deploy is skipped. (Alternative without a token: paste
# worker/dist/rksasikumar-chat.js into the Cloudflare dashboard, see README.)
name: Deploy chat assistant

on:
  push:
    branches: [main]
    paths:
      - worker/**
      - .github/workflows/deploy-chat.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          missing=""
          [ -n "$CF_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CF_ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$AI_KEY" ] || missing="$missing ANTHROPIC_API_KEY"
          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Chat assistant not deployed. Missing repository secrets:$missing"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Install Worker dependencies
        if: steps.check.outputs.ready == 'true'
        working-directory: worker
        run: npm ci

      - name: Deploy Worker
        id: deploy
        if: steps.check.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          packageManager: npm
          wranglerVersion: "4.162.0"
          secrets: |
            ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Show the chat address
        if: steps.check.outputs.ready == 'true'
        run: echo "::notice::Chat assistant deployed at ${{ steps.deploy.outputs.deployment-url }}/chat"
